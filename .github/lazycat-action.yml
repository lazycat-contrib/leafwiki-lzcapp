version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/leafwiki.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: leafwiki

build:
  run_buildscript: false

images:
  - id: leafwiki
    target: service
    service: leafwiki
    source: ghcr.io/perber/leafwiki
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: LeafWiki
    summary: "自托管 Wiki：单二进制 + SQLite + Markdown 落盘"
